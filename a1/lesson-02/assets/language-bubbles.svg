<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">Three short Italian language exchanges</title><desc id="d">Original visual speech bubbles illustrating language questions in informal tu, polite Lei and a negative response with non.</desc><rect width="960" height="340" rx="22" fill="#f7f9fc"/><g fill="#e4f1ed" stroke="#b5d4c8" stroke-width="3"><rect x="12" y="16" width="301" height="310" rx="22"/><rect x="330" y="16" width="301" height="310" rx="22" fill="#e9eefc" stroke="#bfccea"/><rect x="648" y="16" width="300" height="310" rx="22" fill="#fdf0df" stroke="#e6cca7"/></g><g font-family="Arial,sans-serif" font-size="23" fill="#284c65"><text x="32" y="62">1 · TU</text><text x="350" y="62">2 · LEI</text><text x="668" y="62">3 · NON</text></g><g fill="#fff" stroke="#b6c4d0" stroke-width="2"><rect x="30" y="91" width="265" height="77" rx="18"/><rect x="48" y="190" width="246" height="80" rx="18"/><rect x="348" y="91" width="265" height="77" rx="18"/><rect x="366" y="190" width="246" height="80" rx="18"/><rect x="666" y="91" width="265" height="77" rx="18"/><rect x="684" y="190" width="246" height="80" rx="18"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#2b4a63"><text x="51" y="136">Che lingue parli?</text><text x="65" y="225">Parlo italiano.</text><text x="369" y="136">Che lingue parla?</text><text x="382" y="225">Parlo francese.</text><text x="687" y="136">Parli russo?</text><text x="700" y="225">No, non parlo russo.</text></g></svg>