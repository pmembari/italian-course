<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 285" role="img" aria-labelledby="t d"><title id="t">Four mood and response cards</title><desc id="d">Four illustrated faces, numbered one through four: very happy, neutral, unhappy, and a concerned friend. Used to recall Italian greetings and reactions.</desc><rect width="1000" height="285" rx="22" fill="#f6f8fc"/><g font-family="Arial,sans-serif" font-size="26" fill="#244b6a" font-weight="bold"><text x="30" y="49">1</text><text x="280" y="49">2</text><text x="530" y="49">3</text><text x="780" y="49">4</text></g><g><rect x="12" y="12" width="230" height="261" rx="20" fill="#e2f5e7"/><rect x="262" y="12" width="230" height="261" rx="20" fill="#fff2df"/><rect x="512" y="12" width="230" height="261" rx="20" fill="#fce7e9"/><rect x="762" y="12" width="226" height="261" rx="20" fill="#e8eefb"/></g><g stroke="#395166" stroke-width="5" fill="#f5c398"><circle cx="127" cy="137" r="76"/><circle cx="377" cy="137" r="76"/><circle cx="627" cy="137" r="76"/><circle cx="877" cy="137" r="76"/></g><g fill="#304b63"><circle cx="99" cy="118" r="8"/><circle cx="153" cy="118" r="8"/><circle cx="350" cy="118" r="8"/><circle cx="403" cy="118" r="8"/><circle cx="600" cy="118" r="8"/><circle cx="654" cy="118" r="8"/><circle cx="850" cy="118" r="8"/><circle cx="904" cy="118" r="8"/></g><g fill="none" stroke="#304b63" stroke-width="7" stroke-linecap="round"><path d="M94 157Q127 203 160 157"/><path d="M347 172h60"/><path d="M592 188Q627 151 661 188"/><path d="M844 179Q874 148 910 172"/></g><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#304b63"><text x="127" y="248">very well</text><text x="377" y="248">so-so</text><text x="627" y="248">not well</text><text x="877" y="248">sympathy</text></g></svg>