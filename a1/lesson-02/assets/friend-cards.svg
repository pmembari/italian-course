<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d"><title id="t">Two imaginary friends' identity cards</title><desc id="d">Two numbered original identity cards, one for Paolo, a male friend from Torino, and one for Giulia, a female friend from Roma, to practice questo and questa.</desc><rect width="960" height="320" rx="22" fill="#f7f8fc"/><rect x="15" y="15" width="452" height="290" rx="24" fill="#e4f0fa" stroke="#a5bed0" stroke-width="3"/><rect x="493" y="15" width="452" height="290" rx="24" fill="#f8e8ee" stroke="#d9b9c7" stroke-width="3"/><g stroke="#415970" stroke-width="5"><circle cx="128" cy="128" r="45" fill="#e3b293"/><path d="M56 237q0 -66 72 -66t72 66" fill="#7caac9"/><circle cx="600" cy="128" r="45" fill="#d4a27f"/><path d="M527 237q0 -66 73 -66t73 66" fill="#c6a6cc"/></g><g font-family="Arial,sans-serif" fill="#284960"><g font-size="27" font-weight="bold"><text x="221" y="93">1 · Paolo</text><text x="699" y="93">2 · Giulia</text></g><g font-size="22"><text x="221" y="137">da Torino</text><text x="221" y="175">un amico</text><text x="699" y="137">da Roma</text><text x="699" y="175">un'amica</text></g><g font-size="19" fill="#526d80"><text x="45" y="281">Questo è Paolo.</text><text x="523" y="281">Questa è Giulia.</text></g></g></svg>