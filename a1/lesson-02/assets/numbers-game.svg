<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" role="img"><title>Five Italian number flashcards from 20 to 100</title><rect width="960" height="275" rx="20" fill="#f7f9fc"/><rect x="12" y="14" width="176" height="246" rx="16" fill="#e5f3ea"/><text x="100" y="127" text-anchor="middle" font-family="Arial" font-size="68" font-weight="bold" fill="#24506e">21</text><text x="100" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#345c78">ventuno</text><rect x="202" y="14" width="176" height="246" rx="16" fill="#fae9de"/><text x="290" y="127" text-anchor="middle" font-family="Arial" font-size="68" font-weight="bold" fill="#24506e">38</text><text x="290" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#345c78">trentotto</text><rect x="392" y="14" width="176" height="246" rx="16" fill="#e6eefb"/><text x="480" y="127" text-anchor="middle" font-family="Arial" font-size="68" font-weight="bold" fill="#24506e">45</text><text x="480" y="180" text-anchor="middle" font-family="Arial" font-size="17" fill="#345c78">quarantacinque</text><rect x="582" y="14" width="176" height="246" rx="16" fill="#f4e6f4"/><text x="670" y="127" text-anchor="middle" font-family="Arial" font-size="68" font-weight="bold" fill="#24506e">67</text><text x="670" y="180" text-anchor="middle" font-family="Arial" font-size="17" fill="#345c78">sessantasette</text><rect x="772" y="14" width="176" height="246" rx="16" fill="#e5f3ef"/><text x="860" y="127" text-anchor="middle" font-family="Arial" font-size="68" font-weight="bold" fill="#24506e">100</text><text x="860" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#345c78">cento</text></svg>