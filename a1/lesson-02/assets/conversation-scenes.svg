<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img"><title>Three original conversation scenes: how are you, introductions and languages</title><rect width="960" height="380" rx="24" fill="#f6f8fc"/><g fill="#e8f3ee" stroke="#b5d5c4" stroke-width="2"><rect x="14" y="14" width="296" height="352" rx="18"/><rect x="332" y="14" width="296" height="352" rx="18" fill="#f7eaf0"/><rect x="650" y="14" width="296" height="352" rx="18" fill="#e9eff8"/></g><g font-family="Arial" font-weight="bold" font-size="25" fill="#2b526e"><text x="30" y="50">1 · Come stai?</text><text x="348" y="50">2 · Ti presento...</text><text x="666" y="50">3 · Le lingue</text></g><g fill="white" stroke="#c1d0db"><rect x="30" y="68" width="260" height="70" rx="16"/><rect x="348" y="68" width="260" height="70" rx="16"/><rect x="666" y="68" width="260" height="70" rx="16"/></g><g font-family="Arial" font-size="20" fill="#28415d"><text x="49" y="99">Ciao! Come stai?</text><text x="49" y="124">Bene, grazie!</text><text x="369" y="99">Questa è Lucia.</text><text x="369" y="124">Piacere!</text><text x="685" y="99">Parli italiano?</text><text x="685" y="124">Sì, e inglese.</text></g><g stroke="#425a70" stroke-width="6"><circle cx="100" cy="218" r="34" fill="#e9ba97"/><circle cx="235" cy="218" r="34" fill="#cc977a"/><circle cx="419" cy="218" r="34" fill="#d7a683"/><circle cx="553" cy="218" r="34" fill="#e8bd9d"/><circle cx="737" cy="218" r="34" fill="#d5a481"/><circle cx="870" cy="218" r="34" fill="#e7bb99"/><path d="M58 330q0-73 42-73t42 73" fill="#97bcdc"/><path d="M193 330q0-73 42-73t42 73" fill="#e8b391"/><path d="M377 330q0-73 42-73t42 73" fill="#dfb3cc"/><path d="M511 330q0-73 42-73t42 73" fill="#9ebda5"/><path d="M695 330q0-73 42-73t42 73" fill="#96b4d9"/><path d="M828 330q0-73 42-73t42 73" fill="#dabe8a"/></g></svg>