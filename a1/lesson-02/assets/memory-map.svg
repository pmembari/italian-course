<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Lesson 2 memory map: present-tense staircase, work, where and age</title><desc id="d">Four color-coded recall panels showing parlare endings, lavoro in, abito a, and ho anni compared with English I am years old</desc><rect width="960" height="430" rx="24" fill="#f7f9fd"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="18" y="18" width="452" height="185" rx="18" fill="#e5f4ed"/><rect x="490" y="18" width="452" height="185" rx="18" fill="#e6eef9"/><rect x="18" y="223" width="452" height="185" rx="18" fill="#fff0de"/><rect x="490" y="223" width="452" height="185" rx="18" fill="#f0e9fa"/><g font-size="26" font-weight="bold" fill="#244b66"><text x="244" y="60">-ARE ENDINGS</text><text x="716" y="60">WORK</text><text x="244" y="264">HOME / ORIGIN</text><text x="716" y="264">AGE</text></g><g font-size="22" fill="#29455c"><text x="244" y="104">-o · -i · -a</text><text x="244" y="140">-iamo · -ate · -ano</text><text x="716" y="117">Lavoro in farmacia.</text><text x="244" y="315">Sono di Bari.</text><text x="244" y="348">Abito a Milano.</text><text x="716" y="314">Ho venti anni.</text></g><g font-size="17" fill="#52667c"><text x="244" y="174">parlo · parli · parla ...</text><text x="716" y="154">fare: faccio il cuoco</text><text x="244" y="382">di = origin; a = city</text><text x="716" y="354">English: I am 20 years old</text><text x="716" y="378">Italian uses AVERE</text></g></g></svg>