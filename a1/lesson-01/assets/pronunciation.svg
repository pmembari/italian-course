<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250"><title>Italian C and G sound patterns</title><rect width="900" height="250" rx="20" fill="#f5f8fc"/><g fill="#e6f2f3" stroke="#b8d3d8" stroke-width="2"><rect x="10" y="12" width="208" height="225" rx="17"/><rect x="234" y="12" width="208" height="225" rx="17"/><rect x="458" y="12" width="208" height="225" rx="17"/><rect x="682" y="12" width="208" height="225" rx="17"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><g font-size="34" font-weight="bold" fill="#234e70"><text x="114" y="70">CE / CI</text><text x="338" y="70">CHE / CHI</text><text x="562" y="70">GE / GI</text><text x="786" y="70">GHE / GHI</text></g><g font-size="21" fill="#526c80"><text x="114" y="109">soft ch</text><text x="338" y="109">hard k</text><text x="562" y="109">soft j</text><text x="786" y="109">hard g</text></g><g font-size="25" font-weight="bold" fill="#284963"><text x="114" y="174">cinema</text><text x="338" y="174">chitarra</text><text x="562" y="174">gelato</text><text x="786" y="174">spaghetti</text></g></g></svg>