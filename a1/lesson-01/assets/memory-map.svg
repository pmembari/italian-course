<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">Lesson 1 memory map: greeting, name, origin and number</title><desc id="d">Four visual memory cues: informal and formal doors, identity badge for essere, name tag for chiamarsi, and a map marker for di dove</desc><rect width="960" height="400" rx="24" fill="#f7f9fd"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="18" y="20" width="452" height="168" rx="17" fill="#e5f4ea"/><rect x="490" y="20" width="452" height="168" rx="17" fill="#e9eefb"/><rect x="18" y="210" width="452" height="168" rx="17" fill="#fff0df"/><rect x="490" y="210" width="452" height="168" rx="17" fill="#f0eafa"/><g font-size="27" font-weight="bold" fill="#284960"><text x="244" y="73">FRIEND: TU</text><text x="716" y="73">POLITE: LEI</text><text x="244" y="260">NAME TAG</text><text x="716" y="260">ORIGIN MAP</text></g><g font-size="27" fill="#223a4d"><text x="244" y="126">Come ti chiami?</text><text x="716" y="126">Come si chiama?</text><text x="244" y="312">Mi chiamo Luca.</text><text x="716" y="312">Sono di Roma.</text></g><g font-size="18" fill="#52687a"><text x="244" y="159">sei / ti chiami</text><text x="716" y="159">è / si chiama</text><text x="244" y="349">mi + chiamo + name</text><text x="716" y="349">di + city of origin</text></g></g></svg>