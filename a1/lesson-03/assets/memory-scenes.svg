<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Five Italian learning bridges, from picture to sentence"><title>Five Italian learning bridges, from picture to sentence</title><rect width="960" height="440" rx="20" fill="#f6f8fc"/><rect x="10" y="14" width="182" height="400" rx="18" fill="#e4f3ea" stroke="#b5c7d4" stroke-width="2"/><text x="28" y="46" font-family="Arial,sans-serif" font-size="23" fill="#244960" font-weight="bold">1</text><text x="101" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="48" fill="#3c657b">☕</text><text x="101" y="369" font-family="Arial,sans-serif" font-size="21" fill="#2c516d" text-anchor="middle" font-weight="bold">CAFFÈ</text><text x="101" y="393" font-family="Arial,sans-serif" font-size="15" fill="#61788a" text-anchor="middle">Prendo un caffè</text><rect x="200" y="14" width="182" height="400" rx="18" fill="#fff0de" stroke="#b5c7d4" stroke-width="2"/><text x="218" y="46" font-family="Arial,sans-serif" font-size="23" fill="#244960" font-weight="bold">2</text><text x="291" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="48" fill="#3c657b">Y</text><text x="291" y="369" font-family="Arial,sans-serif" font-size="21" fill="#2c516d" text-anchor="middle" font-weight="bold">FORCHETTA</text><text x="291" y="393" font-family="Arial,sans-serif" font-size="15" fill="#61788a" text-anchor="middle">Manca una forchetta</text><rect x="390" y="14" width="182" height="400" rx="18" fill="#e9effb" stroke="#b5c7d4" stroke-width="2"/><text x="408" y="46" font-family="Arial,sans-serif" font-size="23" fill="#244960" font-weight="bold">3</text><text x="481" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="48" fill="#3c657b">≋</text><text x="481" y="369" font-family="Arial,sans-serif" font-size="21" fill="#2c516d" text-anchor="middle" font-weight="bold">PESCE</text><text x="481" y="393" font-family="Arial,sans-serif" font-size="15" fill="#61788a" text-anchor="middle">Preferisco il pesce</text><rect x="580" y="14" width="182" height="400" rx="18" fill="#f5e8ef" stroke="#b5c7d4" stroke-width="2"/><text x="598" y="46" font-family="Arial,sans-serif" font-size="23" fill="#244960" font-weight="bold">4</text><text x="671" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="48" fill="#3c657b">▤</text><text x="671" y="369" font-family="Arial,sans-serif" font-size="21" fill="#2c516d" text-anchor="middle" font-weight="bold">CONTO</text><text x="671" y="393" font-family="Arial,sans-serif" font-size="15" fill="#61788a" text-anchor="middle">Il conto, per favore</text><rect x="770" y="14" width="182" height="400" rx="18" fill="#e5f3f1" stroke="#b5c7d4" stroke-width="2"/><text x="788" y="46" font-family="Arial,sans-serif" font-size="23" fill="#244960" font-weight="bold">5</text><text x="861" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="48" fill="#3c657b">▦</text><text x="861" y="369" font-family="Arial,sans-serif" font-size="21" fill="#2c516d" text-anchor="middle" font-weight="bold">TAVOLO</text><text x="861" y="393" font-family="Arial,sans-serif" font-size="15" fill="#61788a" text-anchor="middle">Per quante persone?</text></svg>